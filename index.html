<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>تسجيل مقاسات الملابس</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px 18px 36px}.langs{position:sticky;top:0;z-index:10;background:#f4f6f8;padding:10px 0 14px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.lang{border:1px solid #d1d5db;background:#fff;border-radius:14px;padding:12px 4px;font-weight:800;font-size:15px;color:#087cf0}.lang.active{background:#111827;color:#fff;border-color:#111827}.head{text-align:center;padding:28px 4px 20px}.head h1{font-size:30px;margin:0 0 8px}.head p{margin:0;color:#6b7280;font-size:18px}.card{background:#fff;border:1px solid #dfe3e8;border-radius:22px;padding:18px;margin:0 0 16px;box-shadow:0 1px 2px rgba(0,0,0,.02)}.title{font-size:21px;font-weight:800;margin-bottom:14px}.req{color:#dc2626}.sizes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;direction:ltr}.size{appearance:none;border:1.5px solid #cbd5e1;background:#fff;border-radius:13px;min-height:48px;font-size:17px;font-weight:800;color:#1f2937}.size.selected{background:#111827;color:#fff;border-color:#111827}.summary{background:#fff;border:1px solid #dfe3e8;border-radius:20px;padding:17px;margin-top:22px}.summary h2{font-size:19px;margin:0 0 10px}.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eef0f2}.row:last-child{border-bottom:0}.value{font-weight:800;direction:ltr}.send{width:100%;border:0;border-radius:16px;padding:16px;margin-top:16px;background:#16a34a;color:white;font-size:19px;font-weight:900}.send:disabled{background:#a7b0ba}.hint{text-align:center;color:#6b7280;font-size:14px;margin-top:10px}@media(max-width:430px){.wrap{padding:10px 12px 28px}.langs{gap:6px}.lang{font-size:14px;padding:11px 2px}.head h1{font-size:28px}.sizes{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body><main class="wrap">
<div class="langs" dir="ltr"><button type="button" class="lang" data-lang="so">Soomaali</button><button type="button" class="lang" data-lang="ur">اردو</button><button type="button" class="lang" data-lang="en">English</button><button type="button" class="lang active" data-lang="ar">العربية</button></div>
<header class="head"><h1 id="mainTitle">تسجيل مقاسات الملابس</h1><p id="subtitle">اختر مقاسًا واحدًا لكل قطعة.</p></header>
<section class="card" data-key="uniform"><div class="title"><span id="uniformLabel">البدلة اليومية</span> <span class="req">*</span></div><div class="sizes"><button type="button" class="size">2XS</button><button type="button" class="size">XS</button><button type="button" class="size">S</button><button type="button" class="size">M</button><button type="button" class="size">L</button><button type="button" class="size">XL</button><button type="button" class="size">2XL</button><button type="button" class="size">3XL</button><button type="button" class="size">4XL</button><button type="button" class="size">5XL</button><button type="button" class="size">6XL</button></div></section>
<section class="card" data-key="shirt"><div class="title"><span id="shirtLabel">القميص</span> <span class="req">*</span></div><div class="sizes"><button type="button" class="size">2XS</button><button type="button" class="size">XS</button><button type="button" class="size">S</button><button type="button" class="size">M</button><button type="button" class="size">L</button><button type="button" class="size">XL</button><button type="button" class="size">2XL</button><button type="button" class="size">3XL</button><button type="button" class="size">4XL</button><button type="button" class="size">5XL</button><button type="button" class="size">6XL</button></div></section>
<section class="card" data-key="belt"><div class="title"><span id="beltLabel">الحزام</span> <span class="req">*</span></div><div class="sizes"><button type="button" class="size">120</button><button type="button" class="size">132</button><button type="button" class="size">152</button><button type="button" class="size">172</button></div></section>
<section class="card" data-key="shoe"><div class="title"><span id="shoeLabel">الحذاء</span> <span class="req">*</span></div><div class="sizes"><button type="button" class="size">38</button><button type="button" class="size">39</button><button type="button" class="size">40</button><button type="button" class="size">41</button><button type="button" class="size">42</button><button type="button" class="size">43</button><button type="button" class="size">44</button><button type="button" class="size">45</button><button type="button" class="size">46</button><button type="button" class="size">47</button><button type="button" class="size">48</button><button type="button" class="size">49</button><button type="button" class="size">50</button></div></section>
<section class="summary"><h2 id="summaryTitle">اختياراتك</h2><div class="row"><span id="sUniform">البدلة اليومية</span><span class="value" data-val="uniform">—</span></div><div class="row"><span id="sShirt">القميص</span><span class="value" data-val="shirt">—</span></div><div class="row"><span id="sBelt">الحزام</span><span class="value" data-val="belt">—</span></div><div class="row"><span id="sShoe">الحذاء</span><span class="value" data-val="shoe">—</span></div><button type="button" id="send" class="send" disabled>إرسال المقاسات عبر واتساب</button><div id="hint" class="hint">أكمل اختيار المقاسات الأربعة لتفعيل الإرسال.</div></section>
</main>
<script>
const selected={uniform:null,shirt:null,belt:null,shoe:null};
const T={ar:{dir:'rtl',title:'تسجيل مقاسات الملابس',sub:'اختر مقاسًا واحدًا لكل قطعة.',uniform:'البدلة اليومية',shirt:'القميص',belt:'الحزام',shoe:'الحذاء',summary:'اختياراتك',send:'إرسال المقاسات عبر واتساب',hint:'أكمل اختيار المقاسات الأربعة لتفعيل الإرسال.'},en:{dir:'ltr',title:'Clothing Size Registration',sub:'Choose one size for each item.',uniform:'Daily uniform',shirt:'Shirt',belt:'Belt',shoe:'Shoes',summary:'Your selections',send:'Send sizes via WhatsApp',hint:'Select all four sizes to enable sending.'},ur:{dir:'rtl',title:'کپڑوں کے سائز کا اندراج',sub:'ہر چیز کے لیے ایک سائز منتخب کریں۔',uniform:'روزانہ کی وردی',shirt:'قمیض',belt:'بیلٹ',shoe:'جوتے',summary:'آپ کے انتخاب',send:'واٹس ایپ کے ذریعے سائز بھیجیں',hint:'بھیجنے کے لیے چاروں سائز منتخب کریں۔'},so:{dir:'ltr',title:'Diiwaangelinta Cabbirka Dharka',sub:'Dooro hal cabbir shay kasta.',uniform:'Dareyska maalinlaha',shirt:'Shaati',belt:'Suun',shoe:'Kabo',summary:'Doorashooyinkaaga',send:'Ku dir cabbirrada WhatsApp',hint:'Dooro afarta cabbir si diristu u shaqeyso.'}};
function setLang(l){const t=T[l];document.documentElement.lang=l;document.documentElement.dir=t.dir;document.querySelector('.wrap').dir=t.dir;document.getElementById('mainTitle').textContent=t.title;document.getElementById('subtitle').textContent=t.sub;document.getElementById('uniformLabel').textContent=document.getElementById('sUniform').textContent=t.uniform;document.getElementById('shirtLabel').textContent=document.getElementById('sShirt').textContent=t.shirt;document.getElementById('beltLabel').textContent=document.getElementById('sBelt').textContent=t.belt;document.getElementById('shoeLabel').textContent=document.getElementById('sShoe').textContent=t.shoe;document.getElementById('summaryTitle').textContent=t.summary;document.getElementById('send').textContent=t.send;document.getElementById('hint').textContent=t.hint;document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('active',b.dataset.lang===l));}
document.querySelectorAll('.lang').forEach(b=>b.addEventListener('click',()=>setLang(b.dataset.lang)));
document.querySelectorAll('.card').forEach(card=>{const key=card.dataset.key;card.querySelectorAll('.size').forEach(btn=>btn.addEventListener('click',()=>{card.querySelectorAll('.size').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected');selected[key]=btn.textContent.trim();document.querySelector('[data-val="'+key+'"]').textContent=selected[key];document.getElementById('send').disabled=!Object.values(selected).every(Boolean);}));});
document.getElementById('send').addEventListener('click',()=>{if(!Object.values(selected).every(Boolean))return;const msg='السلام عليكم\nمقاساتي كالتالي:\nالرقم العسكري: __________\nالبدلة اليومية: '+selected.uniform+'\nالقميص: '+selected.shirt+'\nالحزام: '+selected.belt+'\nالحذاء: '+selected.shoe;window.location.href='https://wa.me/97430753057?text='+encodeURIComponent(msg);});
</script></body></html>
